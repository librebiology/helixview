<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0f2337"/>
  <!-- 4 cols × 3 rows of blocks, 6×7 px, gap 1px, start x=3 y=4 -->
  <!-- Colors: A=green, T=red, G=lightblue(conserved), C=amber -->
  <!-- Row 0 -->
  <rect x="3"  y="4"  width="6" height="7" rx="1" fill="#93c5fd"/>
  <rect x="10" y="4"  width="6" height="7" rx="1" fill="#4ade80"/>
  <rect x="17" y="4"  width="6" height="7" rx="1" fill="#f87171"/>
  <rect x="24" y="4"  width="6" height="7" rx="1" fill="#fcd34d"/>
  <!-- Row 1 -->
  <rect x="3"  y="12" width="6" height="7" rx="1" fill="#93c5fd"/>
  <rect x="10" y="12" width="6" height="7" rx="1" fill="#f87171"/>
  <rect x="17" y="12" width="6" height="7" rx="1" fill="#4ade80"/>
  <rect x="24" y="12" width="6" height="7" rx="1" fill="#fcd34d"/>
  <!-- Row 2 -->
  <rect x="3"  y="20" width="6" height="7" rx="1" fill="#93c5fd"/>
  <rect x="10" y="20" width="6" height="7" rx="1" fill="#4ade80"/>
  <!-- gap -->
  <rect x="17" y="20" width="6" height="7" rx="1" fill="#1e3f59"/>
  <rect x="24" y="20" width="6" height="7" rx="1" fill="#fcd34d"/>
  <!-- Entropy strip -->
  <rect x="3" y="29" width="26" height="2" rx="1" fill="#4ade80" opacity="0.7"/>
</svg>
