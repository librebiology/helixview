[package]
name = "helixview-ui"
version = "0.1.0"
edition = "2021"
description = "iced UI for HelixView"

[dependencies]
helixview-core     = { workspace = true }
helixview-formats  = { workspace = true }
helixview-analysis = { workspace = true }
helixview-external = { workspace = true }
thiserror         = { workspace = true }
anyhow            = { workspace = true }
tracing           = { workspace = true }

iced               = { version = "0.13", features = ["wgpu", "tokio", "canvas"] }
rfd                = "0.15"
tokio              = { version = "1", features = ["full"] }
reqwest            = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { workspace = true }
dirs               = { workspace = true }
svg2pdf            = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
