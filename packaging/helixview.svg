  <rect x="418" y="104" width="44" height="68" rx="6" fill="#fbbf24" filter="url(#bs)"/>
  <rect x="418" y="104" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <!-- ROW 1 (y=184) -->
  <rect x="54"  y="184" width="44" height="68" rx="6" fill="#93c5fd" filter="url(#bs)"/>
  <rect x="54"  y="184" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="106" y="184" width="44" height="68" rx="6" fill="#f87171" filter="url(#bs)"/>
  <rect x="106" y="184" width="44" height="68" rx="6" fill="url(#gloss)"/>

