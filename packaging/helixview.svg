  <rect x="262" y="184" width="44" height="68" rx="6" fill="#4ade80" filter="url(#bs)"/>
  <rect x="262" y="184" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="314" y="184" width="44" height="68" rx="6" fill="#4ade80" filter="url(#bs)"/>
  <rect x="314" y="184" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="366" y="184" width="44" height="68" rx="6" fill="#f87171" filter="url(#bs)"/>
  <rect x="366" y="184" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="418" y="184" width="44" height="68" rx="6" fill="#60a5fa" filter="url(#bs)"/>
  <rect x="418" y="184" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <!-- ROW 2 (y=264) -->
  <rect x="54"  y="264" width="44" height="68" rx="6" fill="#93c5fd" filter="url(#bs)"/>
  <rect x="54"  y="264" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="106" y="264" width="44" height="68" rx="6" fill="#4ade80" filter="url(#bs)"/>
  <rect x="106" y="264" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <!-- gap col 2 -->
  <rect x="158" y="264" width="44" height="68" rx="6" fill="#1e3f59"/>
  <rect x="158" y="264" width="44" height="68" rx="6" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.10"/>

  <rect x="210" y="264" width="44" height="68" rx="6" fill="#fcd34d" filter="url(#bs)"/>
  <rect x="210" y="264" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="262" y="264" width="44" height="68" rx="6" fill="#60a5fa" filter="url(#bs)"/>
  <rect x="262" y="264" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="314" y="264" width="44" height="68" rx="6" fill="#fbbf24" filter="url(#bs)"/>
  <rect x="314" y="264" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="366" y="264" width="44" height="68" rx="6" fill="#f87171" filter="url(#bs)"/>
  <rect x="366" y="264" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="418" y="264" width="44" height="68" rx="6" fill="#fbbf24" filter="url(#bs)"/>
  <rect x="418" y="264" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <!-- ROW 3 (y=344) -->
  <rect x="54"  y="344" width="44" height="68" rx="6" fill="#93c5fd" filter="url(#bs)"/>
  <rect x="54"  y="344" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="106" y="344" width="44" height="68" rx="6" fill="#4ade80" filter="url(#bs)"/>
  <rect x="106" y="344" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="158" y="344" width="44" height="68" rx="6" fill="#f87171" filter="url(#bs)"/>
  <rect x="158" y="344" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="210" y="344" width="44" height="68" rx="6" fill="#fcd34d" filter="url(#bs)"/>
  <rect x="210" y="344" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="262" y="344" width="44" height="68" rx="6" fill="#4ade80" filter="url(#bs)"/>
  <rect x="262" y="344" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="314" y="344" width="44" height="68" rx="6" fill="#4ade80" filter="url(#bs)"/>
  <rect x="314" y="344" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <!-- gap col 6 -->
  <rect x="366" y="344" width="44" height="68" rx="6" fill="#1e3f59"/>
  <rect x="366" y="344" width="44" height="68" rx="6" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.10"/>

  <rect x="418" y="344" width="44" height="68" rx="6" fill="#fbbf24" filter="url(#bs)"/>
  <rect x="418" y="344" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <!-- Entropy strip at bottom -->
  <rect x="54" y="430" width="404" height="14" rx="4" fill="url(#entropy)" opacity="0.80"/>
</svg>
