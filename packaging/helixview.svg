<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="40%" cy="30%" r="70%">
      <stop offset="0%"   stop-color="#234a68"/>
      <stop offset="100%" stop-color="#0f2337"/>
    </radialGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="50%"  stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="entropy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#4ade80"/>
      <stop offset="11%"  stop-color="#facc15"/>
      <stop offset="22%"  stop-color="#f97316"/>
      <stop offset="39%"  stop-color="#4ade80"/>
      <stop offset="50%"  stop-color="#facc15"/>
      <stop offset="65%"  stop-color="#f97316"/>
      <stop offset="78%"  stop-color="#f97316"/>
      <stop offset="89%"  stop-color="#facc15"/>
      <stop offset="100%" stop-color="#facc15"/>
    </linearGradient>
    <filter id="bs" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect width="512" height="512" rx="96" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.07"/>

  <!-- Pairing arc: col-1 ↔ col-6 (x centers: 128 and 388) -->
  <path d="M 128,100 Q 258,46 388,100"
        fill="none" stroke="#7dd3fc" stroke-width="3.5" stroke-linecap="round" opacity="0.55"/>
  <circle cx="128" cy="100" r="5" fill="#7dd3fc" opacity="0.55"/>
  <circle cx="388" cy="100" r="5" fill="#7dd3fc" opacity="0.55"/>

  <!-- Macro for a block: each is rect + gloss overlay -->
  <!-- col_x = 54 + col*52,  row_y = 104 + row*80,  size 44×68 -->

  <!-- ROW 0 (y=104) -->
  <rect x="54"  y="104" width="44" height="68" rx="6" fill="#93c5fd" filter="url(#bs)"/>
  <rect x="54"  y="104" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="106" y="104" width="44" height="68" rx="6" fill="#4ade80" filter="url(#bs)"/>
  <rect x="106" y="104" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="158" y="104" width="44" height="68" rx="6" fill="#f87171" filter="url(#bs)"/>
  <rect x="158" y="104" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="210" y="104" width="44" height="68" rx="6" fill="#fcd34d" filter="url(#bs)"/>
  <rect x="210" y="104" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="262" y="104" width="44" height="68" rx="6" fill="#60a5fa" filter="url(#bs)"/>
  <rect x="262" y="104" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="314" y="104" width="44" height="68" rx="6" fill="#4ade80" filter="url(#bs)"/>
  <rect x="314" y="104" width="44" height="68" rx="6" fill="url(#gloss)"/>

  <rect x="366" y="104" width="44" height="68" rx="6" fill="#f87171" filter="url(#bs)"/>
